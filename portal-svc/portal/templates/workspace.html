<!doctype html><html lang="en"><meta charset="utf-8"><title>Research workspace</title>
<style>body{max-width:70rem;margin:2rem auto;font:16px system-ui;padding:1rem}button{margin:.3rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}section{border:1px solid #888;padding:1rem}</style>
<h1>Retained research workspace</h1><p>Independent roots. Server retention and permissions apply. Experimental capabilities may be unavailable.</p>
<button id="reload">Reload roots</button><p id="status" role="status"></p><section id="roots"></section><section><h2>Selected root</h2><pre id="detail"></pre><div id="actions"></div><div id="citations"></div><label>Explicit attachment session <input id="session" maxlength="200"></label><label>Expected session revision <input id="sessionRevision" type="number" min="0" value="0"></label><button id="attach">Attach selected root</button><button id="cancel">Cancel selected run</button><button id="delete">Delete selected root</button><pre id="artifact"></pre></section>
<script>
const $=id=>document.getElementById(id);let selected=null;
async function read(path){const r=await fetch('/workspace/api/'+path,{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+await r.text());return r.headers.get('content-type').includes('json')?r.json():r.text()}
async function select(id){try{const d=await read('workspace/'+encodeURIComponent(id));selected=d;$('detail').textContent=JSON.stringify(d,null,2);$('citations').replaceChildren();for(const evidence of d.evidence||[]){const b=document.createElement('button');b.textContent='Evidence '+evidence.evidence_id+' ['+evidence.start+':'+evidence.end+']';b.onclick=async()=>{try{const source=await read(evidence.url.split('/v1/')[1]);const quote=[...source.body].slice(evidence.start,evidence.end).join('');const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(quote)))).map(x=>x.toString(16).padStart(2,'0')).join('');if(digest!==evidence.quote_digest)throw Error('Citation digest mismatch');$('artifact').textContent=quote+'\nQuote digest: '+digest+'\nSource digest: '+source.content_digest}catch(e){$('status').textContent=e.message}};$('citations').append(b)}$('actions').replaceChildren();$('artifact').textContent='';for(const [name,action] of Object.entries(d.actions||{})){if(action.method!=='GET'||!action.url)continue;const b=document.createElement('button');b.textContent=name;b.onclick=async()=>{try{const result=await read(action.url.split('/v1/')[1]);$('artifact').textContent=typeof result==='string'?result:JSON.stringify(result,null,2)}catch(e){$('status').textContent=e.message}};$('actions').append(b)}history.replaceState(null,'','#'+encodeURIComponent(id))}catch(e){$('status').textContent=e.message;$('detail').textContent='';$('actions').replaceChildren()}}
async function reload(){try{const d=await read('workspace');$('status').textContent='Stage: '+d.capabilities.implementation_stage+'; recovery: '+d.capabilities.recovery_mode;$('roots').replaceChildren();for(const root of d.items){const b=document.createElement('button');b.textContent=root.objective+' ('+root.state+')';b.onclick=()=>select(root.run_id);$('roots').append(b)}if(location.hash)await select(decodeURIComponent(location.hash.slice(1)))}catch(e){$('status').textContent=e.message;$('roots').replaceChildren()}}
async function act(name,body){if(!selected||!selected.actions[name])return;try{const r=await fetch('/workspace/action/workspace/'+encodeURIComponent(selected.run_id)+'/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:name,expected_revision:selected.revision,...body})});if(!r.ok)throw Error(r.status+' '+await r.text());$('status').textContent='Action completed: '+name;await reload()}catch(e){$('status').textContent=e.message}}
$('attach').onclick=()=>act('attach',{session_id:$('session').value,expected_session_revision:Number($('sessionRevision').value)});$('cancel').onclick=()=>act('cancel');$('delete').onclick=()=>{if(confirm('Delete this retained research root and evidence?'))act('delete')};$('reload').onclick=reload;reload();
</script></html>
